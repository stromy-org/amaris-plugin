# Volume is the thing to control here. Ungrouped, Dependabot opens one PR per
# dependency per week; across the org that reached 89 open PRs on 2026-07-27, which
# is well past the point where anyone reads them.
#
# Grouping is by UPDATE TYPE so major updates stay separate across ecosystems:
#
#   patch + minor → ONE `version-updates` group; central merger policy applies
#   major  → individual PRs; source canary and review policy apply
#
# The pattern groups come FIRST so peer-coupled packages still travel together.
# ORG-PLAN-449 P3C (operator decision 2026-10-22): ONE monthly version-updates
# group per ecosystem (patch + minor together; the merger treats both alike),
# majors as individual PRs, `rebase-strategy: disabled` (no repo requires
# up-to-date branches, and a rebase re-runs CI for no new answer). Security
# updates are not version updates: they stay ungrouped and open immediately.
version: 2
updates:

  - package-ecosystem: "npm"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    groups:
      remotion:
        applies-to: version-updates
        patterns: ["remotion", "@remotion/*"]
      # react + react-dom MUST bump together — react-dom@N requires react@N, so a
      # split bump opens two PRs that each fail peer-resolution. One group → one
      # resolvable PR. (No-op for plugins without React deps.)
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom"]
      version-updates:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # "uv", not "pip": this project is uv-managed with a committed uv.lock. The pip
  # ecosystem edits pyproject.toml and has no knowledge of uv.lock, so it lands a
  # dependency change with no matching relock; the two then disagree and any local
  # `uv run` rewrites the lock and dirties the checkout. That is what happened to
  # the ruff bound in stromy-org/Stromy#42. "uv" updates both files in one commit.


  - package-ecosystem: "uv"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    rebase-strategy: "disabled"
    groups:
      version-updates:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Action bumps are pure CI plumbing; one grouped PR per month.

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 14
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
