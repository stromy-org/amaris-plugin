name: dependabot-auto-merge

# GENERATED by stromy-org/scripts/dependabot_automerge.py — do not edit here.
# This repo is PUBLIC, and a public repo cannot call a workflow that lives in
# the private stromy-org repo, so it carries this inline copy of
# stromy-org/.github/workflows/dependabot-auto-merge.yml instead. Edit that
# file; `--ensure` re-renders this one.

# One authored classifier. Private repositories call it; public repositories
# receive the inline form from scripts/dependabot_automerge.py. Preserve the
# job identity used by existing callers and CI attribution. No merge is armed:
# scripts/merge-ready-prs.py alone revalidates product health before actuation.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    # Existing caller calibration: p95 0.2 min over 21 green runs.
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report update classification
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          {
            printf 'Dependabot ecosystem: %s\n' "$ECOSYSTEM"
            printf 'Dependabot update type: %s\n' "$UPDATE_TYPE"
            printf 'Classification only. No native auto-merge is enabled.\n'
            printf 'The control-plane merger evaluates provenance, CI, product health and rollout evidence before merging.\n'
          } >> "$GITHUB_STEP_SUMMARY"
