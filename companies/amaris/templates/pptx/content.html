<!--
  Amaris Consulting — PPTX content slide anchor (FRAME ONLY).
  Consumed by the `pptx` / `pptx-hd` render-anchors mode.

  Rebuilt 2026-09-22 from the styling source of truth
  (.build-history/source-Amaris-Nespresso-Academy-styling-SoT.pptx).
  Extraction of record: clients/amaris/presentation-grammar.md.

  Encodes ONLY the brand-consistent frame — canvas, circle field, title zone,
  margins, corner wordmark, page number. The body zone is intentionally empty:
  the LLM authoring a real deck fills it. Do NOT add prescriptive body layout here.
  For the component vocabulary that body should be built from, see the sibling
  reference sheet `components.html` (a swatch, not a slide).

  CHANGED: the canvas is a white -> #FBF5F2 vertical gradient, never flat white.
  The navy+blush header strip and the monospace footer bar are retired — neither
  appears on any of the 23 source slides.

  Injected: {{TITLE}} {{SUBTITLE}} {{LOGO_MONO_URL}} {{WORDMARK_GHOST_URL}}
            {{CLIENT_NAME}} {{CONFIDENTIALITY}} {{PAGE}} {{PAGES}}
            {{TOKENS_CSS}} {{FONT_FACES}}
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{{TOKENS_CSS}}
{{FONT_FACES}}

html, body { margin: 0; padding: 0; }
body {
  width: 1280px; height: 720px;
  background: var(--canvas-light, linear-gradient(180deg, #ffffff 0%, #fbf5f2 100%));
  color: var(--ink-body, #3a3a52);
  font-family: var(--font-body, 'Century Gothic', sans-serif);
  position: relative;
  overflow: hidden;
}

/* --- circle field: 2 per content slide. Behind everything. ---------------- */
.circle-field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.circle-field circle.lg { opacity: var(--circle-opacity-large, 0.18); }
.circle-field circle.sm { opacity: var(--circle-opacity-small, 0.85); }

/* --- ghost wordmark, bleeding off the bottom-right ------------------------ */
.ghost-wordmark {
  position: absolute; right: -80px; bottom: -40px; z-index: 0;
  width: 520px; opacity: var(--motif-ghost-opacity, 0.08);
  pointer-events: none;
}

/* --- title zone ----------------------------------------------------------- */
.head {
  position: absolute; top: var(--slide-title-top, 67px);
  left: var(--slide-margin, 56px); right: var(--slide-margin, 56px); z-index: 2;
}
.title {
  margin: 0;
  font-size: var(--pt-slide-title, 32pt);
  font-weight: 700;
  line-height: 1.12;
  color: var(--ink-title, #1e1e5e);
}
.subtitle {
  margin: 10px 0 0;
  font-size: var(--pt-subtitle, 12pt);
  font-weight: 400;
  color: var(--ink-muted, #4a4a7a);
}

/* --- body zone — LLM-authored. Left empty on purpose. --------------------- */
.body {
  position: absolute;
  top: var(--slide-content-top, 154px);
  left: var(--slide-margin, 56px); right: var(--slide-margin, 56px);
  bottom: 68px;
  z-index: 1;
}

/* --- foot: corner wordmark + page number --------------------------------- */
.wordmark { position: absolute; right: var(--slide-margin, 56px); bottom: 26px; z-index: 2; }
.wordmark img { height: 26px; width: auto; opacity: 0.75; }
.page {
  position: absolute; left: var(--slide-margin, 56px); bottom: 30px; z-index: 2;
  font-size: 9pt; font-weight: 400;
  letter-spacing: var(--track-tight, 0.67pt);
  color: var(--ink-meta, #6c757d);
}
</style>
</head>
<body>

  <svg class="circle-field" viewBox="0 0 1280 720" aria-hidden="true">
    <circle class="lg" cx="1095" cy="160" r="335" fill="var(--circle-2, #b880ff)"/>
    <circle class="lg" cx="26"   cy="523" r="169" fill="var(--circle-1, #4182ff)"/>
  </svg>

  <img class="ghost-wordmark" src="{{WORDMARK_GHOST_URL}}" alt="">

  <div class="head">
    <h1 class="title">{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>

  <!-- body zone — the authoring LLM owns this. See components.html. -->
  <div class="body"></div>

  <div class="page">{{PAGE}} / {{PAGES}} · {{CONFIDENTIALITY}}</div>
  <div class="wordmark"><img src="{{LOGO_MONO_URL}}" alt="Amaris Consulting"></div>

</body>
</html>
