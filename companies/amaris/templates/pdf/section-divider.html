<!--
  Amaris Consulting — PDF page shell (Section divider), A4 portrait.
  Consumed by the `pdf-hd` skill / `render-anchors` mode.

  Rebuilt 2026-09-22 from the client-supplied styling source of truth
  (.build-history/source-Amaris-Nespresso-Academy-styling-SoT.pptx, slides 8/21).
  Extraction of record: clients/amaris/presentation-grammar.md.

  CHANGED: no hero photograph and no indigo scrim ({{HERO_URL}} is deliberately
  not accepted — photography is removed from this brand's render path), flat
  #002060 field, ghost numeral + 2 pt blue rule, Century Gothic throughout.

  Injected: {{PART_LABEL}} {{SECTION_NUMBER}} {{SECTION_TITLE}} {{SECTION_SUBTITLE}}
            {{LOGO_WHITE_URL}} {{TOKENS_CSS}} {{FONT_FACES}}
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
{{TOKENS_CSS}}
{{FONT_FACES}}

@page { size: A4; margin: 0; }
html, body { margin: 0; padding: 0; }
body {
  width: 210mm; height: 297mm;
  background: var(--canvas-navy, #002060);
  color: var(--ink-on-dark, #fff);
  font-family: var(--font-heading, 'Century Gothic', sans-serif);
  position: relative;
  overflow: hidden;
}

.circle-field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.circle-field svg { width: 100%; height: 100%; display: block; }
.circle-field circle.lg { opacity: var(--circle-opacity-large, 0.20); }
.circle-field circle.sm { opacity: var(--circle-opacity-small, 0.35); }

.block { position: absolute; top: 96mm; left: 18mm; right: 18mm; z-index: 2; }

.part {
  font-size: 9pt; font-weight: 700;
  letter-spacing: var(--track-wide, 2pt);
  text-transform: uppercase;
  color: var(--ink-on-dark-soft, #f5e2da);
}
.ghost-numeral {
  margin: 4mm 0 0;
  font-size: 66pt; font-weight: 700; line-height: 0.92;
  color: rgba(255,255,255,0.16);
}
.title {
  margin: 2mm 0 0;
  font-size: 34pt; font-weight: 700; line-height: 1.08;
  color: var(--ink-on-dark, #fff);
}
.rule { width: 60mm; height: 0; margin: 9mm 0 0; border-top: var(--divider-rule, 2pt solid #4182ff); }
.subtitle {
  margin: 6mm 0 0;
  font-size: 12pt; font-weight: 400; line-height: 1.4;
  color: var(--ink-on-dark-soft, #f5e2da);
  max-width: 125mm;
}

.logo { position: absolute; bottom: 16mm; left: 18mm; z-index: 2; }
.logo img { height: 8mm; width: auto; opacity: 0.85; }
</style>
</head>
<body>

  <div class="circle-field">
    <svg viewBox="0 0 210 297" preserveAspectRatio="none" aria-hidden="true">
      <circle class="lg" cx="18"  cy="22"  r="58" fill="var(--circle-1, #4182ff)"/>
      <circle class="lg" cx="196" cy="252" r="62" fill="var(--circle-2, #b880ff)"/>
      <circle class="sm" cx="105" cy="268" r="14" fill="var(--circle-3, #7ddeb8)"/>
    </svg>
  </div>

  <div class="block">
    <div class="part">{{PART_LABEL}}</div>
    <div class="ghost-numeral">{{SECTION_NUMBER}}</div>
    <h1 class="title">{{SECTION_TITLE}}</h1>
    <div class="rule"></div>
    <div class="subtitle">{{SECTION_SUBTITLE}}</div>
  </div>

  <div class="logo"><img src="{{LOGO_WHITE_URL}}" alt="Amaris Consulting"></div>

</body>
</html>
